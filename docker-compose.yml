volumes:
  db_data: null
  search_data: null
  persistent_data: null

# Define common environment variables
x-environment: &common-env
  # general
  APP_NAME: ${APP_NAME:-AppName}
  APP_URL: ${APP_URL:-https://app.example.com}
  APP_KEY: ${APP_KEY}
  # Sanctum
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-''}
  # session
  SESSION_DOMAIN: ${SESSION_DOMAIN:-null}
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  # mysql
  DB_USERNAME: ${MYSQL_USERNAME:-app}
  DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
  DB_DATABASE: ${MYSQL_DATABASE:-app}
  # redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
  # scout
  MEILISEARCH_KEY: ${MEILISEARCH_KEY}
  # mail
  MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
  # time
  TZ: ${TZ:-UTC}
  TIMEZONE: ${TZ:-UTC}
  APP_TIMEZONE: ${TZ:-UTC}
  # Queue
  QUEUE_WORKER_TIMEOUT: ${QUEUE_WORKER_TIMEOUT}

services:
  app:
    image: app:latest
    restart: unless-stopped
    environment:
      <<: *common-env
    volumes:
      - "persistent_data:/app/storage"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      search:
        condition: service_healthy

  queueworker:
    image: worker:latest
    restart: unless-stopped
    environment:
      <<: *common-env
    volumes:
      - "persistent_data:/app/storage"
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    image: scheduler:latest
    restart: unless-stopped
    environment:
      <<: *common-env
    volumes:
      - "persistent_data:/app/storage"
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mariadb:latest
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secret}
      MARIADB_DATABASE: ${MYSQL_DATABASE:-app}
      MARIADB_USER: ${MYSQL_USERNAME:-app}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-secret}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init/mysql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  search:
    image: getmeili/meilisearch:v1.14.0
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - search_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  logger:
    image: busybox
    restart: unless-stopped
    command: echo "" > /app/storage/logs/laravel.log && tail -f /app/storage/logs/laravel.log
    volumes:
      - "persistent_data:/app/storage"
    depends_on:
      app:
        condition: service_healthy